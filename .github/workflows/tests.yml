name: Pruebas de Barquitos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --experimental-vm-modules --test "tests/*.test.cjs"
      - run: node --experimental-vm-modules tests/validate_repo.cjs
