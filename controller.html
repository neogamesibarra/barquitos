<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ctext y=%2752%27 font-size=%2752%27%3E%E2%9B%B5%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#121820">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/controller-192.png">
  <title>BARQUITOS - Mando Móvil</title>
  <link rel="stylesheet" href="css/controller.css?v=62">
</head>
<body>
  <!-- Modal para ingresar el código de sala si no se escaneó el QR -->
  <div id="room-overlay" class="room-overlay" style="display: none;">
    <div class="room-dialog">
      <h2>UNIRSE A LA SALA</h2>
      <p>Escribe el código de 4 letras que aparece en la TV:</p>
      <input id="room-input" type="text" maxlength="4" placeholder="EJ: 8421" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
      <button id="btn-join-room" type="button">ENTRAR AL JUEGO ⚓</button>
    </div>
  </div>

  <!-- Pantalla principal del mando (Forzada horizontal en cualquier orientación) -->
  <div id="gamepad-container" class="gamepad-container">
    <!-- Barra superior con información del jugador y botón de pantalla completa -->
    <div class="top-bar">
      <div class="status-indicator" role="status">
        <span id="conn-dot" class="conn-dot"></span>
        <span id="conn-text" class="conn-text">Conectando...</span>
      </div>

      <div id="player-badge" class="player-badge">
        <span id="player-symbol" class="player-symbol">●</span>
        <span id="player-name" class="player-name">ASIGNANDO BARCO...</span>
        <span id="player-team" class="player-team" hidden></span>
      </div>

      <div class="top-bar-actions">
        <button id="btn-style-toggle" class="style-toggle-btn" type="button" title="Cambiar estilo de mando">
          <span class="style-icon">🎮</span>
          <span id="style-text" class="style-text">CLÁSICO</span>
        </button>
        <button id="btn-fullscreen" class="fullscreen-btn" type="button" title="Pantalla completa" aria-label="Pantalla completa">
          <span aria-hidden="true">⛶</span>
        </button>
        <button id="btn-ready" class="ready-btn" type="button">
          LISTO ✓
        </button>
      </div>
    </div>

    <!-- Barra de configuración de Capitán en Lobby (Nombre personalizado y Elección de Equipo) -->
    <div id="lobby-config-bar" class="lobby-config-bar">
      <div class="nickname-box">
        <span class="nickname-icon">✏️</span>
        <input id="input-nickname" type="text" maxlength="12" placeholder="Tu Apodo (Opcional)" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <div id="team-selector" class="team-selector" style="display: none;">
        <button id="btn-team-blue" class="team-choice-btn blue" type="button">🔵 EQUIPO AZUL</button>
        <button id="btn-team-red" class="team-choice-btn red" type="button">🔴 EQUIPO ROJO</button>
      </div>
    </div>

    <!-- Zona de mandos táctiles -->
    <p id="ship-sunk" class="ship-sunk" role="status" hidden><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="9" r="3"/><path d="M24 12v25M17 18h14M10 27c0 8 6 13 14 13s14-5 14-13m-32 3 4-4 4 4m20 0 4-4 4 4"/></svg><strong>¡TE HUNDIERON!</strong> <span>Esperando siguiente ronda…</span></p>
    <div class="controls-area">
      <svg class="bridge-compass" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="20"/><circle cx="24" cy="24" r="15"/><path d="m29 14-3 12-7 8 3-12zM24 2v5m0 34v5M2 24h5m34 0h5"/></svg>
      <!-- MITAD IZQUIERDA: Zona de Dirección (Timón Clásico o Botones Compactos) -->
      <div id="steering-zone" class="steering-zone">
        <!-- Modo Clásico: Timón Naval Virtual -->
        <div id="classic-steer" class="classic-steer-container">
          <div class="zone-label">TIMÓN / GIRO</div>
          <div id="wheel-outer" class="wheel-outer" aria-label="Joystick de dirección de 360 grados">
            <svg class="wheel-dial" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 2v5m0 34v5M2 24h5m34 0h5M8.5 8.5l3 3m25 25 3 3m0-31-3 3m-25 25-3 3"/><circle cx="24" cy="24" r="15" stroke-width=".65"/></svg>
            <div id="wheel-indicator" class="wheel-indicator"></div>
            <div id="wheel-knob" class="wheel-knob"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="9" r="3"/><path d="M24 12v25M17 18h14M10 27c0 8 6 13 14 13s14-5 14-13m-32 3 4-4 4 4m20 0 4-4 4 4"/></svg></div>
          </div>
          <div class="turn-labels">
            <span>DIRECCIÓN 360°</span>
          </div>
        </div>

      </div>

      <!-- MITAD DERECHA: Botones de Acción / Panel de Anfitrión Mando 1 -->
      <div class="actions-zone">
        <!-- Panel Anfitrión (Solo aparece en Mando 1 en Lobby o Podio para iniciar o cambiar modo) -->
        <div id="host-panel" class="host-panel" style="display: none;">
          <button id="btn-host-start" class="host-action-btn start-round-btn" type="button">
            ⚓ INICIAR PARTIDA
          </button>
          <button id="btn-host-mode" class="host-action-btn change-mode-btn" type="button">
            🔄 MODO: BATALLA
          </button>
          <button id="btn-host-lobby" class="host-action-btn change-mode-btn" type="button" hidden>
            🏠 MENÚ PRINCIPAL
          </button>
        </div>

        <!-- Botón Acelerar / Impulso -->
        <div id="btn-thrust" class="touch-btn thrust-btn">
          <div class="btn-icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 7c9 5 9 11 0 17-9-6-9-12 0-17zm-15 26c0-10 5-13 15-9 0 11-6 14-15 9zm30 0c-9 5-15 2-15-9 10-4 15-1 15 9z"/><circle cx="24" cy="24" r="3" fill="currentColor"/></svg></div>
          <div class="btn-label">ACELERAR</div>
          <div class="btn-sublabel">IMPULSO</div>
        </div>

        <!-- Botón Disparar Cañón -->
        <div id="btn-shoot" class="touch-btn shoot-btn">
          <div class="btn-icon"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="14"/><circle cx="24" cy="24" r="4"/><path d="M24 4v9m0 22v9M4 24h9m22 0h9"/></svg></div>
          <div class="btn-label">DISPARAR</div>
          <div class="btn-sublabel">CAÑÓN</div>
          <output id="ship-ammo" class="ship-ammo" aria-label="Munición" hidden></output>
        </div>
      </div>
    </div>
  </div>

  <p class="orientation-hint">Gira el teléfono para jugar en horizontal</p>

  <!-- Scripts del mando móvil (Moderno ES6+) -->
  <script src="js/paho-mqtt.min.js"></script>
  <script type="module" src="js/controller.js"></script>
</body>
</html>
