<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BARQUITOS - Mando Móvil</title>
  <link rel="stylesheet" href="css/controller.css?v=40">
</head>
<body>
  <!-- Modal para ingresar el código de sala si no se escaneó el QR -->
  <div id="room-overlay" class="room-overlay" style="display: none;">
    <div class="room-dialog">
      <h2>UNIRSE A LA SALA</h2>
      <p>Escribe el código de 4 letras que aparece en la TV:</p>
      <input id="room-input" type="text" maxlength="4" placeholder="EJ: 8421" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
      <button id="btn-join-room" type="button">ENTRAR AL JUEGO ⚓</button>
    </div>
  </div>

  <!-- Pantalla principal del mando (Forzada horizontal en cualquier orientación) -->
  <div id="gamepad-container" class="gamepad-container">
    <!-- Barra superior con información del jugador y botón de pantalla completa -->
    <div class="top-bar">
      <div class="status-indicator">
        <span id="conn-dot" class="conn-dot"></span>
        <span id="conn-text" class="conn-text">Conectando...</span>
      </div>

      <div id="player-badge" class="player-badge">
        <span id="player-symbol" class="player-symbol">●</span>
        <span id="player-name" class="player-name">ASIGNANDO BARCO...</span>
      </div>

      <div class="top-bar-actions">
        <button id="btn-view-game" class="view-game-btn" type="button" title="Ver Pantalla de Juego Online">
          <span class="style-icon">📺</span>
          <span class="style-text">PANTALLA</span>
        </button>
        <button id="btn-style-toggle" class="style-toggle-btn" type="button" title="Cambiar estilo de mando">
          <span class="style-icon">🎮</span>
          <span id="style-text" class="style-text">CLÁSICO</span>
        </button>
        <button id="btn-fullscreen" class="fullscreen-btn" type="button" title="Pantalla Completa">
          ⛶
        </button>
        <button id="btn-ready" class="ready-btn" type="button">
          LISTO ✓
        </button>
      </div>
    </div>

    <!-- Barra de configuración de Capitán en Lobby (Nombre personalizado y Elección de Equipo) -->
    <div id="lobby-config-bar" class="lobby-config-bar">
      <div class="nickname-box">
        <span class="nickname-icon">✏️</span>
        <input id="input-nickname" type="text" maxlength="12" placeholder="Tu Apodo (Opcional)" autocomplete="off" autocorrect="off" spellcheck="false">
      </div>
      <div id="team-selector" class="team-selector" style="display: none;">
        <button id="btn-team-blue" class="team-choice-btn blue" type="button">🔵 EQUIPO AZUL</button>
        <button id="btn-team-red" class="team-choice-btn red" type="button">🔴 EQUIPO ROJO</button>
      </div>
    </div>

    <!-- Zona de mandos táctiles -->
    <div class="controls-area">
      <!-- MITAD IZQUIERDA: Zona de Dirección (Timón Clásico o Botones Compactos) -->
      <div id="steering-zone" class="steering-zone">
        <!-- Modo Clásico: Timón Naval Virtual -->
        <div id="classic-steer" class="classic-steer-container">
          <div class="zone-label">TIMÓN / GIRO</div>
          <div id="wheel-outer" class="wheel-outer">
            <div id="wheel-indicator" class="wheel-indicator"></div>
            <div id="wheel-knob" class="wheel-knob">⚓</div>
          </div>
          <div class="turn-labels">
            <span>◀ BABOR</span>
            <span>ESTRIBOR ▶</span>
          </div>
        </div>

        <!-- Modo Compacto / Ergonómico para Pantallas Grandes y Manos Pequeñas -->
        <div id="compact-steer" class="compact-steer-container" style="display: none;">
          <div class="zone-label">DIRECCIÓN ERGONÓMICA</div>
          <div class="compact-buttons-row">
            <div id="btn-steer-left" class="compact-dir-btn dir-left">
              <span class="dir-icon">◀</span>
              <span class="dir-title">BABOR</span>
              <span class="dir-sub">IZQUIERDA</span>
            </div>
            <div id="btn-steer-right" class="compact-dir-btn dir-right">
              <span class="dir-icon">▶</span>
              <span class="dir-title">ESTRIBOR</span>
              <span class="dir-sub">DERECHA</span>
            </div>
          </div>
        </div>
      </div>

      <!-- MITAD DERECHA: Botones de Acción / Panel de Anfitrión Mando 1 -->
      <div class="actions-zone">
        <!-- Panel Anfitrión (Solo aparece en Mando 1 en Lobby o Podio para iniciar o cambiar modo) -->
        <div id="host-panel" class="host-panel" style="display: none;">
          <button id="btn-host-start" class="host-action-btn start-round-btn" type="button">
            ⚓ INICIAR PARTIDA
          </button>
          <button id="btn-host-mode" class="host-action-btn change-mode-btn" type="button">
            🔄 MODO: BATALLA
          </button>
        </div>

        <!-- Botón Acelerar / Impulso -->
        <div id="btn-thrust" class="touch-btn thrust-btn">
          <div class="btn-icon">💨</div>
          <div class="btn-label">ACELERAR</div>
          <div class="btn-sublabel">IMPULSO</div>
        </div>

        <!-- Botón Disparar Cañón -->
        <div id="btn-shoot" class="touch-btn shoot-btn">
          <div class="btn-icon">💣</div>
          <div class="btn-label">DISPARAR</div>
          <div class="btn-sublabel">CAÑÓN</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts del mando móvil (Moderno ES6+) -->
  <script src="js/paho-mqtt.min.js"></script>
  <script src="js/cloud_network.js?v=28"></script>
  <script src="js/controller.js?v=40"></script>
</body>
</html>
